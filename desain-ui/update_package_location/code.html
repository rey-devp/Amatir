<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LogiTrack - Update Location</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13c8ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101f22",
                        "surface-dark": "#192f33",
                        "border-dark": "#325e67",
                        "text-secondary": "#92c0c9"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased">
<!-- Main Container -->
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl">
<!-- Header -->
<div class="sticky top-0 z-10 flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between border-b dark:border-border-dark/30 border-gray-200">
<div class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center justify-center cursor-pointer rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Update Lokasi</h2>
</div>
<!-- Scrollable Content -->
<div class="flex-1 flex flex-col p-4 gap-6">
<!-- Input Section: Receipt ID -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-white text-base font-medium leading-normal">Nomor Resi</label>
<div class="flex w-full items-stretch rounded-lg shadow-sm">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-border-dark bg-white dark:bg-surface-dark focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-text-secondary p-[15px] border-r-0 text-base font-normal leading-normal transition-all" placeholder="Input ID or Scan..." type="text" value="JP-882190"/>
<button class="flex items-center justify-center px-4 rounded-r-lg border border-l-0 border-gray-300 dark:border-border-dark bg-gray-50 dark:bg-surface-dark hover:bg-gray-100 dark:hover:bg-[#234147] transition-colors group cursor-pointer">
<span class="material-symbols-outlined text-gray-500 dark:text-text-secondary group-hover:text-primary transition-colors text-2xl">qr_code_scanner</span>
</button>
</div>
</div>
<!-- Package Info Card (Conditional Render style) -->
<div class="flex flex-col gap-3">
<div class="flex items-start justify-between gap-4 rounded-xl bg-white dark:bg-surface-dark p-4 shadow-md border border-gray-100 dark:border-transparent">
<div class="flex flex-col gap-2 flex-[2]">
<div class="flex flex-col">
<span class="text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-text-secondary/70">Receipt ID</span>
<p class="text-primary text-xl font-bold leading-tight tracking-tight">JP-882190</p>
</div>
<div class="w-full h-px bg-gray-100 dark:bg-border-dark/50 my-1"></div>
<div class="grid grid-cols-1 gap-1">
<p class="text-sm text-slate-500 dark:text-text-secondary">Lokasi Saat Ini:</p>
<div class="flex items-center gap-1.5 text-slate-800 dark:text-white font-medium">
<span class="material-symbols-outlined text-lg text-primary">location_on</span>
                                Hub Surabaya
                            </div>
</div>
<div class="grid grid-cols-1 gap-1 mt-1">
<p class="text-sm text-slate-500 dark:text-text-secondary">Status:</p>
<div class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-200 w-fit">
                                On Process
                            </div>
</div>
</div>
<div class="w-24 h-24 shrink-0 rounded-lg bg-gray-200 dark:bg-gray-700 overflow-hidden relative border border-gray-200 dark:border-border-dark/50">
<img alt="Cardboard boxes stacked in a warehouse" class="w-full h-full object-cover" data-alt="Cardboard boxes stacked in a warehouse" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAvMshxZtKPsHx5gAsriWQDYlfijb7Q6p0r_LTF7BWQ345ytKX8kJrQpW8ZQvUEMxnfk_k63nNTX2VQA_-8VtoKJ9qkUiaavoQul6SGKXBuyzNJf5MMS-EmZyiwEntklECg0ef74__zFO7fn6omyTNk7qfBAS3Zr2X0wzl0r3I3mq4kM_rkNvlA0socUVGDCbgCebCACOh9uKwYKqAMYJMw2LO9IWNdrd41fnOaqLeWGuwZvqXBckTsV7-l2XAX5o6z82VZXO7g-LE"/>
</div>
</div>
</div>
<div class="w-full h-px bg-gray-200 dark:bg-border-dark/50"></div>
<!-- Action Form -->
<div class="flex flex-col gap-5">
<!-- Location Dropdown -->
<label class="flex flex-col w-full">
<p class="text-slate-700 dark:text-white text-base font-medium leading-normal pb-2">Lokasi Baru</p>
<div class="relative">
<select class="appearance-none w-full cursor-pointer rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-border-dark bg-white dark:bg-surface-dark focus:border-primary h-14 pl-4 pr-10 text-base font-normal leading-normal transition-all">
<option disabled="" value="">Pilih Lokasi...</option>
<option selected="" value="gudang-jkt">Gudang Jakarta (Cakung)</option>
<option value="hub-bdg">Hub Bandung</option>
<option value="hub-smg">Hub Semarang</option>
<option value="hub-sby">Hub Surabaya</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 dark:text-text-secondary">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</label>
<!-- Status Dropdown -->
<label class="flex flex-col w-full">
<p class="text-slate-700 dark:text-white text-base font-medium leading-normal pb-2">Status Update</p>
<div class="relative">
<select class="appearance-none w-full cursor-pointer rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-border-dark bg-white dark:bg-surface-dark focus:border-primary h-14 pl-4 pr-10 text-base font-normal leading-normal transition-all">
<option disabled="" value="">Pilih Status...</option>
<option selected="" value="inbound">Barang Diterima (Inbound)</option>
<option value="sorting">Dalam Penyortiran (Sorting)</option>
<option value="outbound">Siap Dikirim (Outbound)</option>
<option value="issue">Issue / Hold</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 dark:text-text-secondary">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</label>
</div>
<!-- Spacer to push button to bottom if content is short -->
<div class="flex-1"></div>
</div>
<!-- Footer / Fixed Button Area -->
<div class="sticky bottom-0 w-full bg-background-light dark:bg-background-dark p-4 border-t dark:border-border-dark/30 border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary hover:bg-cyan-400 active:scale-[0.98] transition-all text-background-dark text-lg font-bold leading-normal tracking-wide shadow-lg shadow-primary/25">
<span class="mr-2">Update Posisi Paket</span>
<span class="material-symbols-outlined text-xl font-bold">check_circle</span>
</button>
</div>
</div>
</body></html>
